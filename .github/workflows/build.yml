name: Build OBS Lite Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: OBS-Lite-Windows
          path: release/*.exe
          if-no-files-found: error
